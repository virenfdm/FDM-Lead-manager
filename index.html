<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBA Admission Lead Manager | FDM</title>
  <link rel="icon" href="FDM.JPG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { display: ['"Bricolage Grotesque"', 'Figtree', 'sans-serif'], sans: ['Figtree', 'system-ui', 'sans-serif'] },
      colors: {
        navy: { 50: '#f1f3fa', 100: '#dfe3f1', 200: '#c3cae3', 500: '#3b4a8c', 600: '#27346b', 700: '#1c2754', 800: '#141c40', 900: '#0d1230' },
        brand: { 50: '#fff1f0', 100: '#ffe0de', 500: '#e4413d', 600: '#d6362f', 700: '#b82a25' }
      } } } };
  </script>
  <style>
    body { font-family: 'Figtree', system-ui, sans-serif; background: #f4f5fa; color: #1b2140; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; letter-spacing: -.015em; }
    .navlink { display: flex; align-items: center; gap: .75rem; border-radius: .75rem; padding: .65rem .8rem; font-size: .9rem; font-weight: 500; color: #4a5277; transition: background .15s, color .15s; }
    .navlink:hover { background: #f1f3fa; color: #141c40; }
    .navlink.nav-on { background: #fff1f0; color: #b82a25; font-weight: 700; }
    .navlink svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    details > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::after { content: ''; width: 8px; height: 8px; border-right: 2px solid #6b7399; border-bottom: 2px solid #6b7399; transform: rotate(45deg); transition: transform .2s; }
    details[open] > summary::after { transform: rotate(-135deg); }
    details[open] > summary { border-bottom: 1px solid #e6e9f4; }
    :focus-visible { outline: 2px solid #e4413d; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-50; }
      .btn-primary { @apply btn bg-brand-600 text-white shadow-[0_8px_16px_-8px_rgba(214,54,47,.7)] hover:bg-brand-700; }
      .btn-outline { @apply btn border border-navy-200 bg-white text-navy-800 hover:border-navy-500 hover:bg-navy-50; }
      .btn-danger { @apply btn bg-[#8f1d1a] text-white hover:bg-[#751714]; }
      .input { @apply w-full rounded-xl border border-navy-100 bg-white px-3.5 py-2.5 text-sm placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-100; }
      .label { @apply mb-1.5 block text-xs font-semibold text-slate-500; }
      .card { @apply rounded-2xl border border-navy-100/80 bg-white; }
      .th { @apply whitespace-nowrap px-4 py-3 text-left text-xs font-semibold text-slate-500; }
      .td { @apply px-4 py-3 text-sm; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="fixed right-4 top-4 z-[100] space-y-2"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
